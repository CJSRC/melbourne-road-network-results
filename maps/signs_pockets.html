const pocketLayer = L.layerGroup(POCKETS.map(p => L.circleMarker([p.y, p.x], {radius: 6, color: '#fff', weight: 1,
    fillColor: pColour(p), fillOpacity: .95}).bindPopup(`<div class='pop'><b>${p.n}</b> (${p.id})<br>` +
    (p.s === 'pocket' ? `s1 ${p.s1} m, s2 ${p.s2} m<br>${p.e === 'median' ? T.median : T.kerb}, ${p.kd}<br>${T.conf}: ${p.cf}<br>` +
      (p.f ? `${T.flags}: ${p.f}<br>` : '') : (p.s === 'no pocket' ? T.pn : T.pu) + '<br>') +
    `${p.v === 'A' ? T.sat : T.sv}</div>`)));
signLayer.addTo(map); pocketLayer.addTo(map);
const ov = {}; ov[T.signs] = signLayer; ov[T.pockets] = pocketLayer;
L.control.layers(null, ov, {collapsed: false}).addTo(map);
const lg = L.control({position: 'bottomright'});
lg.onAdd = () => { const d = L.DomUtil.create('div', 'legend');
  d.innerHTML = `<b>${T.signs}</b><br>` + ['ban', 'control', 'other', 'none'].map(k => `<i style='background:${sColour[k]}'></i>${T[k]}`).join('<br>') +
    `<br><b>${T.pockets}</b><br><i style='background:#85c1e9'></i>${T.p1}<br><i style='background:#2471a3'></i>${T.p2}<br>` +
    `<i style='background:#154360'></i>${T.p3}<br><i style='background:#aab7b8'></i>${T.pn}<br><i style='background:#7f8c8d'></i>${T.pu}`;
  return d; };
lg.addTo(map);
const all = SIGNS.concat(POCKETS).map(p => [p.y, p.x]); if (all.length) map.fitBounds(all);
</script></body></html>
